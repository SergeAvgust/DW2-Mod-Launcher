name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DW2ModLauncher.sln

      - name: Format check
        run: dotnet format DW2ModLauncher.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build DW2ModLauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/DW2ModLauncher.Tests -c Release --no-build
